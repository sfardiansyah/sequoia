services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sequoia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sequoia}
      POSTGRES_DB: ${POSTGRES_DB:-sequoia}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/001-test-db.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-sequoia} -d ${POSTGRES_DB:-sequoia}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    command: ["bun", "run", "db:migrate"]
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-sequoia}:${POSTGRES_PASSWORD:-sequoia}@postgres:5432/${POSTGRES_DB:-sequoia}"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    command: ["bun", "run", "start:api"]
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: "postgres://${POSTGRES_USER:-sequoia}:${POSTGRES_PASSWORD:-sequoia}@postgres:5432/${POSTGRES_DB:-sequoia}"
      JWT_PRIVATE_KEYS: "${JWT_PRIVATE_KEYS:?set JWT_PRIVATE_KEYS in .env}"
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  test:
    build: .
    profiles: ["test"]
    command: ["bun", "run", "test:integration"]
    environment:
      NODE_ENV: test
      TEST_DATABASE_URL: "postgres://${POSTGRES_USER:-sequoia}:${POSTGRES_PASSWORD:-sequoia}@postgres:5432/sequoia_test"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

volumes:
  postgres-data:
  redis-data:

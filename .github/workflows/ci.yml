name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: sequoia
          POSTGRES_PASSWORD: sequoia
          POSTGRES_DB: sequoia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sequoia -d sequoia_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test:integration
        env:
          TEST_DATABASE_URL: postgres://sequoia:sequoia@localhost:5432/sequoia_test
